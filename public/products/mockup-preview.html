<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Museum Grade Frame Mockup | Sports Memorabilia Store</title>
    <style>
        :root {
            --frame-black: #1a1a1a;
            --mount-black: #0d0d0d;
            --gold-inlay: #d4af37;
            --plaque-gold: #c5a059;
            --cream-border: #f5f5dc;
        }

        body {
            background: #222;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
            color: white;
        }

        .instructions {
            margin-bottom: 20px;
            text-align: center;
            color: #aaa;
            font-size: 14px;
        }

        /* The Outer Frame */
        .museum-frame {
            background: var(--frame-black);
            padding: 40px;
            box-shadow: 
                inset 0 0 15px rgba(0,0,0,0.8),
                20px 20px 40px rgba(0,0,0,0.5);
            border: 10px solid #111;
            display: flex;
            gap: 20px;
            position: relative;
        }

        /* The Mount Board */
        .mount-board {
            background: var(--mount-black);
            padding: 30px;
            display: flex;
            gap: 25px;
            border: 1px solid #333;
        }

        /* Window Styling */
        .window {
            background: #333;
            position: relative;
            box-shadow: inset 2px 2px 10px rgba(0,0,0,0.9);
            border: 3px solid var(--gold-inlay); /* The gold piping */
            overflow: hidden;
        }

        .window::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            border: 1px solid var(--cream-border); /* Subtle cream edge */
            pointer-events: none;
        }

        /* Main Shirt Window */
        .shirt-window {
            width: 450px;
            height: 450px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            background: #4a0404; /* Red shirt vibe */
            background-image: linear-gradient(to bottom, #7a0505, #3a0404);
            position: relative;
        }

        /* Simulating the shirt texture/folds */
        .shirt-window::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 50% 30%, rgba(255,255,255,0.05) 0%, transparent 70%);
            pointer-events: none;
        }

        .shirt-content {
            text-align: center;
            color: white;
            font-weight: bold;
            padding-bottom: 40px;
            z-index: 1;
        }

        .shirt-name {
            font-size: 50px;
            letter-spacing: 5px;
            margin-bottom: 5px;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.8);
            font-family: 'Inter', sans-serif;
            text-transform: uppercase;
        }

        .shirt-number {
            font-size: 160px;
            line-height: 1;
            text-shadow: 5px 5px 15px rgba(0,0,0,0.8);
            font-family: 'Inter', sans-serif;
        }

        /* Right Side Column */
        .side-column {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 160px;
        }

        .photo-window {
            height: 160px;
            background-size: cover;
            background-position: center;
            background-color: #222;
        }

        /* The Deep Engraved Plaque - RE-ENGINEERED */
        .engraved-plaque {
            height: 65px;
            background: linear-gradient(135deg, 
                #a67c00 0%, 
                #bf9b30 25%, 
                #ffbf00 50%, 
                #bf9b30 75%, 
                #a67c00 100%
            );
            border: 1px solid #8b6508;
            box-shadow: 
                0 4px 8px rgba(0,0,0,0.6),
                inset 0 1px 1px rgba(255,255,255,0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 5px;
            position: relative;
            /* Brushed metal texture simulation */
            background-image: 
                repeating-linear-gradient(45deg, rgba(0,0,0,0.02) 0px, rgba(0,0,0,0.02) 1px, transparent 1px, transparent 2px),
                linear-gradient(135deg, #a67c00 0%, #ffbf00 50%, #a67c00 100%);
        }

        .plaque-text {
            font-family: 'Times New Roman', serif;
            color: #3d2b00; /* Darker, slightly translucent for depth */
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            
            /* The 'Engraving' Magic: 
               1. Dark inset shadow for depth (top/left)
               2. Light highlight for the 'ledge' (bottom/right)
            */
            text-shadow: 
                -1px -1px 1px rgba(0,0,0,0.8),  /* Deepest shadow */
                1px 1px 1px rgba(255,255,255,0.6); /* Light catching the bottom edge */
            
            filter: contrast(1.2);
            line-height: 1.3;
        }

        .plaque-text.main-name {
            font-size: 12px;
            margin-bottom: 3px;
            letter-spacing: 1.5px;
            border-bottom: 0.5px solid rgba(0,0,0,0.2);
            padding-bottom: 2px;
        }

        .controls {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        button {
            padding: 12px 24px;
            background: var(--gold-inlay);
            border: 2px solid white;
            color: black;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: transform 0.1s;
        }

        button:hover {
            transform: scale(1.05);
            background: #f9e27d;
        }
    </style>
</head>
<body>

    <div class="instructions">
        DIGITAL PRODUCT MOCKUP: ORIGI-STYLE 3-WINDOW MOUNT<br>
        Deep Engraved Plaque Simulation + Gold Inlay Detailing
    </div>

    <div class="museum-frame">
        <div class="mount-board">
            <!-- Central Shirt -->
            <div class="window shirt-window">
                <div class="shirt-content">
                    <div class="shirt-name" id="preview-name">MAC ALLISTER</div>
                    <div class="shirt-number" id="preview-number">10</div>
                </div>
            </div>
            
            <!-- Side Assets -->
            <div class="side-column">
                <div class="window photo-window" id="photo-top" style="background-image: url('https://images.unsplash.com/photo-1574629810360-7efbbe195018?q=80&w=2076');"></div>
                
                <!-- The Plaque -->
                <div class="engraved-plaque">
                    <div class="plaque-text main-name" id="plaque-name">ALEXIS MAC ALLISTER</div>
                    <div class="plaque-text">Liverpool FC</div>
                    <div class="plaque-text">World Cup Winner</div>
                </div>

                <div class="window photo-window" id="photo-bottom" style="background-image: url('https://images.unsplash.com/photo-1543351611-58f69d7c1781?q=80&w=1974');"></div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button onclick="updatePreview('MAC ALLISTER', '10')">Load Mac Allister</button>
        <button onclick="updatePreview('FERNANDO TORRES', '9')">Load Torres</button>
        <button onclick="updatePreview('STEVEN GERRARD', '8')">Load Gerrard</button>
    </div>

    <script>
        function updatePreview(name, number) {
            document.getElementById('preview-name').innerText = name.split(' ').pop();
            document.getElementById('preview-number').innerText = number;
            document.getElementById('plaque-name').innerText = name;
            
            // Adjust plaque text for Torres
            if(name === 'FERNANDO TORRES') {
                document.querySelectorAll('.plaque-text')[2].innerText = '2x Euro Champion';
            } else if(name === 'STEVEN GERRARD') {
                document.querySelectorAll('.plaque-text')[2].innerText = 'Champions League Winner';
            } else {
                document.querySelectorAll('.plaque-text')[2].innerText = 'World Cup Winner';
            }
        }
    </script>
</body>
</html>
