<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1200" width="100%" height="100%" style="background: #e0e0e0; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <!-- Drop Shadow for the Mat to look like a physical board on a desk -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="15" dy="25" stdDeviation="15" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    
    <!-- Arrow Markers (Gold) -->
    <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#d4af37" />
    </marker>
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d4af37" />
    </marker>

    <!-- Arrow Markers (White) -->
    <marker id="arrow-start-w" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#ffffff" />
    </marker>
    <marker id="arrow-end-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffffff" />
    </marker>

    <style>
      .gold { fill: #d4af37; }
      .gold-stroke { stroke: #d4af37; stroke-width: 4; fill: none; }
      .white { fill: #ffffff; }
      .text-xl { font-size: 28px; font-weight: bold; text-anchor: middle; letter-spacing: 1px; }
      .text-large { font-size: 20px; font-weight: bold; text-anchor: middle; }
      .text-medium { font-size: 15px; font-weight: bold; text-anchor: middle; letter-spacing: 0.5px; }
      .text-small { font-size: 13px; font-weight: bold; text-anchor: middle; }
      .arrow { stroke: #d4af37; stroke-width: 2; marker-start: url(#arrow-start); marker-end: url(#arrow-end); }
      .arrow-w { stroke: #ffffff; stroke-width: 2; marker-start: url(#arrow-start-w); marker-end: url(#arrow-end-w); }
    </style>
  </defs>

  <!-- Title Text Above Mat -->
  <text x="220" y="100" class="gold" style="font-size: 28px; font-weight: bold; letter-spacing: 1px; text-anchor: start;">OVERALL MAT SIZE: 24" x 20"</text>
  <line x1="220" y1="120" x2="600" y2="120" stroke="#d4af37" stroke-width="2" />

  <!-- Shift the entire mat to center it perfectly to scale -->
  <g transform="translate(220, 200)">
    
    <!-- Mat Background (Black with Shadow) -->
    <!-- Math: 24" x 20" scaled by 40px per inch = 960px x 800px -->
    <rect x="0" y="0" width="960" height="800" fill="#181818" filter="url(#shadow)" />
    
    <!-- Main Jersey Section (Left) -->
    <!-- Math: 15" x 16" = 600px x 640px. Margin: 2" = 80px -->
    <rect x="80" y="80" width="600" height="640" class="gold-stroke" />
    <rect x="84" y="84" width="592" height="632" stroke="#444" stroke-width="1" fill="none" />
    
    <text x="380" y="140" class="white text-medium">MAIN JERSEY SECTION APERTURE:</text>
    <text x="380" y="165" class="white text-medium">15" WIDE x 16" HIGH</text>
    
    <text x="380" y="400" class="white text-xl">JERSEY</text>
    <text x="380" y="435" class="white text-xl">PLACEMENT</text>
    
    <g transform="translate(130, 400) rotate(-90)">
      <text x="0" y="0" class="gold text-medium">GOLD INNER BORDER:</text>
      <text x="0" y="25" class="gold text-medium">14.75" x 15.75"</text>
    </g>

    <!-- Top Photo -->
    <!-- Math: X=720 (600+80+40), W=160 (4"), H=240 (6") -->
    <rect x="720" y="80" width="160" height="240" class="gold-stroke" />
    <text x="800" y="120" class="white text-small">TOP PHOTO</text>
    <text x="800" y="140" class="white text-small">BLACK APERTURE:</text>
    <text x="800" y="160" class="white text-small">4" x 6"</text>
    <text x="800" y="220" class="white text-large">PHOTO 1</text>
    <text x="800" y="285" class="gold text-small">GOLD BORDER:</text>
    <text x="800" y="305" class="gold text-small">3.75" x 5.75"</text>

    <!-- Middle Plaque -->
    <!-- Math: Y=360 (80+240+40), H=80 (2") -->
    <rect x="720" y="360" width="160" height="80" class="gold-stroke" />
    <text x="800" y="385" class="white text-small" style="font-size: 11px;">MIDDLE PLAQUE</text>
    <text x="800" y="400" class="white text-small" style="font-size: 11px;">BLACK APERTURE:</text>
    <text x="800" y="415" class="white text-small" style="font-size: 11px;">4" x 2"</text>
    <text x="800" y="432" class="gold text-small" style="font-size: 10px;">GOLD BORDER: 3.75" x 1.75"</text>

    <!-- Bottom Photo -->
    <!-- Math: Y=480 (360+80+40), H=240 (6") -->
    <rect x="720" y="480" width="160" height="240" class="gold-stroke" />
    <text x="800" y="520" class="white text-small">BOTTOM PHOTO</text>
    <text x="800" y="540" class="white text-small">BLACK APERTURE:</text>
    <text x="800" y="560" class="white text-small">4" x 6"</text>
    <text x="800" y="620" class="white text-large">PHOTO 2</text>
    <text x="800" y="685" class="gold text-small">GOLD BORDER:</text>
    <text x="800" y="705" class="gold text-small">3.75" x 5.75"</text>

    <!-- ============================================== -->
    <!-- ARROWS & DIMENSION LINES -->
    <!-- ============================================== -->
    
    <!-- Top Left 2" -->
    <line x1="160" y1="10" x2="160" y2="70" class="arrow" />
    <text x="180" y="45" class="white text-large">2"</text>
    
    <line x1="10" y1="120" x2="70" y2="120" class="arrow" />
    <text x="40" y="105" class="white text-large">2"</text>
    
    <!-- Bottom Left 2" -->
    <line x1="10" y1="680" x2="70" y2="680" class="arrow" />
    <text x="40" y="665" class="white text-large">2"</text>
    
    <line x1="160" y1="730" x2="160" y2="790" class="arrow" />
    <text x="180" y="765" class="white text-large">2"</text>
    
    <!-- Right 2" -->
    <line x1="890" y1="120" x2="950" y2="120" class="arrow" />
    <text x="920" y="105" class="white text-large">2"</text>
    
    <line x1="890" y1="680" x2="950" y2="680" class="arrow" />
    <text x="920" y="665" class="white text-large">2"</text>

    <!-- Bottom Center 2" -->
    <line x1="480" y1="730" x2="480" y2="790" class="arrow" />
    <text x="500" y="765" class="white text-large">2"</text>

    <!-- 1" Gaps -->
    <line x1="685" y1="120" x2="715" y2="120" class="arrow" />
    <text x="700" y="145" class="white text-medium">1"</text>
    
    <line x1="685" y1="400" x2="715" y2="400" class="arrow" />
    <text x="700" y="425" class="white text-medium">1"</text>

    <line x1="800" y1="325" x2="800" y2="355" class="arrow" />
    <text x="820" y="345" class="white text-medium">1"</text>
    
    <line x1="800" y1="445" x2="800" y2="475" class="arrow" />
    <text x="820" y="465" class="white text-medium">1"</text>

    <!-- Large White Arrow for Main Aperture Width -->
    <line x1="90" y1="120" x2="670" y2="120" class="arrow-w" />
    
  </g>
</svg>
