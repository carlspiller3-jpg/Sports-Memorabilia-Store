<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Algorithm Optimizer - Sports Memorabilia Store</title>
    <style>
        :root {
            --navy: #1a1a2e;
            --gold: #d4af37;
            --gold-light: #f4e4c1;
            --ivory: #f5f5f0;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--navy) 0%, #0f0f1a 100%);
            min-height: 100vh;
            padding: 1rem;
            color: var(--ivory);
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.5);
            font-size: 1rem;
            letter-spacing: 1px;
        }

        .input-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
            background: rgba(0, 0, 0, 0.2);
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 700;
            color: var(--gold);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        button.generate-btn {
            background: linear-gradient(135deg, var(--gold) 0%, #b8962d 100%);
            color: var(--navy);
            border: none;
            padding: 1.2rem;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        /* Tabs */
        .tabs-container {
            margin-top: 3rem;
            display: none;
        }

        .tabs-container.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        .tabs-nav {
            display: flex;
            gap: 0.5rem;
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .tab-btn {
            padding: 0.8rem 1.5rem;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            transition: all 0.2s;
            border-radius: 8px 8px 0 0;
            white-space: nowrap;
        }

        .tab-btn.active {
            color: var(--gold);
            background: var(--glass);
            border-bottom: 3px solid var(--gold);
        }

        .tab-content {
            display: none;
            background: rgba(0, 0, 0, 0.2);
            padding: 2rem;
            border-radius: 0 0 12px 12px;
            border: 1px solid var(--border);
        }

        .tab-content.active {
            display: block;
        }

        .output-card { margin-bottom: 2rem; position: relative; }
        .output-label { display: flex; justify-content: space-between; margin-bottom: 0.8rem; }
        .output-label span { font-size: 0.75rem; color: var(--gold); font-weight: 800; text-transform: uppercase; }
        .char-tag { background: rgba(255, 255, 255, 0.1); padding: 2px 8px; border-radius: 4px; font-size: 10px; }
        .output-box { background: rgba(0, 0, 0, 0.3); border: 1px solid var(--border); border-radius: 8px; padding: 1.2rem; white-space: pre-wrap; font-size: 0.95rem; border-left: 4px solid var(--gold); position: relative; }
        .copy-trigger { position: absolute; top: 0.5rem; right: 0.5rem; background: var(--gold); color: var(--navy); border: none; padding: 4px 10px; border-radius: 4px; font-size: 10px; font-weight: 800; cursor: pointer; }

        .pill-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .pill { background: var(--glass); border: 1px solid var(--gold); color: var(--gold-light); padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>⚡ ALGORITHM SEO</h1>
            <p class="subtitle">Platform-Aware Optimization Suite</p>
        </header>

        <form id="masterForm">
            <div class="input-section">
                <div class="form-groups">
                    <div class="form-group">
                        <label>Athlete Name *</label>
                        <input type="text" id="athlete" required>
                    </div>
                    <div class="form-group">
                        <label>Item Type *</label>
                        <select id="itemType" required>
                            <option value="Shirt">Signed Shirt</option>
                            <option value="Glove">Signed Glove</option>
                            <option value="Boot">Signed Boot</option>
                            <option value="Photo">Signed Photo</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Year / Season *</label>
                        <input type="text" id="year" required>
                    </div>
                </div>
                <div class="form-groups">
                    <div class="form-group">
                        <label>Team / Event</label>
                        <input type="text" id="team">
                    </div>
                    <div class="form-group">
                        <label>Signing Details (City, Date)</label>
                        <input type="text" id="signingDetails">
                    </div>
                    <div class="form-group">
                        <label>Authenticity</label>
                        <select id="auth">
                            <option value="Sports Memorabilia Store™ NFC">Sports Memorabilia Store™ NFC</option>
                            <option value="Beckett">Beckett Authenticated</option>
                        </select>
                    </div>
                </div>
            </div>
            <button type="submit" class="generate-btn">Generate For All Algorithms</button>
        </form>

        <div id="results" class="tabs-container">
            <div class="tabs-nav">
                <button class="tab-btn active" onclick="showTab('google')">Google</button>
                <button class="tab-btn" onclick="showTab('ebay')">eBay (Cassini)</button>
                <button class="tab-btn" onclick="showTab('etsy')">Etsy</button>
                <button class="tab-btn" onclick="showTab('amazon')">Amazon (A10)</button>
            </div>

            <div id="google" class="tab-content active">
                <div class="output-card">
                    <div class="output-label"><span>SEO Title</span><span class="char-tag" id="googT-count">0/60</span></div>
                    <div class="output-box" id="googT"></div>
                </div>
                <div class="output-card">
                    <div class="output-label"><span>Meta Description</span><span class="char-tag" id="googM-count">0/160</span></div>
                    <div class="output-box" id="googM"></div>
                </div>
            </div>

            <div id="ebay" class="tab-content">
                <div class="output-card">
                    <div class="output-label"><span>eBay Title (Cassini Optimized)</span><span class="char-tag" id="ebayT-count">0/80</span></div>
                    <div class="output-box" id="ebayT"></div>
                </div>
                <div class="output-card">
                    <div class="output-label"><span>Cassini Specifics</span></div>
                    <div class="output-box" id="ebayH"></div>
                </div>
            </div>

            <div id="etsy" class="tab-content">
                <div class="output-card">
                    <div class="output-label"><span>Etsy Gift Title</span><span class="char-tag" id="etsyT-count">0/140</span></div>
                    <div class="output-box" id="etsyT"></div>
                </div>
                <div class="output-card">
                    <div class="output-label"><span>13 SEO Tags (Synchronized)</span></div>
                    <div class="pill-grid" id="etsyTags"></div>
                </div>
            </div>

            <div id="amazon" class="tab-content">
                <div class="output-card">
                    <div class="output-label"><span>Amazon A10 Title (Brand-First)</span></div>
                    <div class="output-box" id="amzT"></div>
                </div>
                <div class="output-card">
                    <div class="output-label"><span>Value-Driven Bullets</span></div>
                    <div class="output-box" id="amzB"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('masterForm');
        form.addEventListener('submit', (e) => { e.preventDefault(); generate(); });

        function smartTrim(text, max) {
            if (text.length <= max) return text;
            const t = text.substring(0, max);
            const ls = t.lastIndexOf(" ");
            return ls > 0 ? t.substring(0, ls) : t;
        }

        function generate() {
            const athlete = document.getElementById('athlete').value.trim();
            const type = document.getElementById('itemType').value;
            const year = document.getElementById('year').value.trim();
            const team = document.getElementById('team').value.trim();
            const SD = document.getElementById('signingDetails').value.trim();
            const auth = document.getElementById('auth').value;

            // GOOGLE
            setRes('googT', smartTrim(`${athlete} Signed ${type} | Authentic ${team || year} Memorabilia`, 60), 60);
            setRes('googM', smartTrim(`Own an authentic hand-signed ${athlete} ${type.toLowerCase()}. Verified by ${auth}. Gallery-framed quality. 100% guarantee.`, 160), 160);

            // EBAY (CASSINI)
            const ebTitle = smartTrim(`${athlete} SIGNED ${type} ${team} ${year} COA AUTHENTIC PRO FRAMED`, 80).toUpperCase();
            setRes('ebayT', ebTitle, 80);
            setRes('ebayH', `Provenance: ${SD || 'Private Session'}\nCOA: ${auth}\nFraming: Professional Gallery Frame`);

            // ETSY (MARKETPLACE INSIGHTS)
            setRes('etsyT', smartTrim(`${athlete} Signed ${type} Gift, Custom Framed ${team} Memorabilia, ${year}`, 140), 140);
            const tags = [athlete, `Signed ${type}`, team, 'Sports Gift', 'Gifts for Him', 'Birthday Gift', 'Custom Framed', year, 'Sports Memorabilia Store'];
            document.getElementById('etsyTags').innerHTML = tags.map(t => `<div class="pill">${t}</div>`).join('');

            // AMAZON (A10)
            setRes('amzT', smartTrim(`Sports Memorabilia Store - Authentic ${athlete} Signed ${type} (${team} ${year})`, 150));
            setRes('amzB', `• OFFICIAL: Signed by ${athlete} - ${SD || 'Verified'}.\n• AUTHENTIC: Features Store™ NFC Technology.\n• PREMIUM: Housed in professional gallery framing.\n• GUARANTEE: 100% lifetime authenticity guarantee.`);

            document.getElementById('results').classList.add('active');
        }

        function setRes(id, val, max) {
            const box = document.getElementById(id);
            box.innerHTML = `<button class="copy-trigger" onclick="copyBox('${id}')">COPY</button>${val}`;
            const count = document.getElementById(id + '-count');
            if (count) count.textContent = `${val.length}/${max}`;
        }

        function showTab(id) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(id).classList.add('active');
        }

        function copyBox(id) {
            const txt = document.getElementById(id).innerText.replace('COPY', '').trim();
            navigator.clipboard.writeText(txt).then(() => {
                const btn = event.target;
                btn.textContent = 'COPIED!';
                setTimeout(() => btn.textContent = 'COPY', 2000);
            });
        }
    </script>
</body>
</html>
